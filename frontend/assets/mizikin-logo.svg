<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">MIZIKIN Logo</title>
  <desc id="desc">Logo circulaire orange avec lettrage jaune MIZIKIN et mention Music and Art Urban Festival.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f57b58"/>
      <stop offset="65%" stop-color="#f26645"/>
      <stop offset="100%" stop-color="#d94d2f"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <path d="M70 48h116v126l-30 24H70Z" fill="none" stroke="#f3c64e" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#f3c64e" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="78" y="98" font-size="44" letter-spacing="-2">MIZI</text>
    <text x="78" y="136" font-size="44" letter-spacing="-2">KIN</text>
    <text x="82" y="168" font-size="20" letter-spacing="-1">MUSIC</text>
    <text x="82" y="188" font-size="16">&amp; ART</text>
    <text x="82" y="210" font-size="11" letter-spacing="0.5">URBAN FESTIVAL</text>
  </g>
</svg>
