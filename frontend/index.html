<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Character & Viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    
    <!-- SEO & Description -->
    <title>MIZIKIN - Music & Art Urban Festival</title>
    <meta name="description" content="MIZIKIN centralise la billetterie, la gestion et la verification de vos evenements musicaux et culturels.">
    <meta name="theme-color" content="#f26645">
    <meta name="robots" content="index, follow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/mizikin-logo.svg">
    
    <!-- Accessibility -->
    <meta name="og:title" content="MIZIKIN">
    <meta name="og:description" content="Billetterie, gestion et verification pour vos evenements musicaux et artistiques.">
    <meta name="og:type" content="website">
    
    <!-- Performance: Preconnect to CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://unpkg.com">
    
    <!-- Stylesheets & Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Loading indicator styles -->
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        #app.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(242, 102, 69, 0.16), transparent 30%),
                linear-gradient(180deg, #08131b 0%, #10202b 100%);
        }
        .loader-container {
            text-align: center;
        }
        .loader-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f3c64e;
            margin: 0 5px;
            animation: bounce 1.4s infinite;
        }
        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
    <!-- Main Application Container -->
    <div id="app" class="loading">
        <div class="loader-container">
            <div class="mb-4">
                <span class="text-5xl">◉</span>
            </div>
            <p class="text-base text-slate-600 mb-4">Chargement de MIZIKIN...</p>
            <div>
                <span class="loader-dot"></span>
                <span class="loader-dot"></span>
                <span class="loader-dot"></span>
            </div>
        </div>
    </div>
    
    <!-- No JavaScript Warning -->
    <noscript>
        <div class="bg-red-50 border-l-4 border-red-500 p-6 m-4 rounded">
            <h1 class="text-xl font-bold text-red-700 mb-2">JavaScript est désactivé</h1>
            <p class="text-red-600">Cette plateforme nécessite JavaScript pour fonctionner. Veuillez activer JavaScript dans vos paramètres de navigateur.</p>
        </div>
    </noscript>
    
    <!-- Scripts with defer for non-blocking loading -->
    
    <!-- Data & Utilities Layer -->
    <script src="js/db.js" defer></script>
    <script src="js/utils.js" defer></script>
    
    <!-- Component Layer -->
    <script src="js/components.js" defer></script>
    
    <!-- Page Modules Layer -->
    <script src="js/pages/auth.js" defer></script>
    <script src="js/pages/public.js" defer></script>
    <script src="js/pages/organizer.js" defer></script>
    <script src="js/pages/verifier.js" defer></script>
    <script src="js/pages/admin.js" defer></script>
    <script src="js/pages/users.js" defer></script>
    
    <!-- Router Layer (Initializes the app) -->
    <script src="js/router.js" defer></script>

</body>

</html>
